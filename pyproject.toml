[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-stepfun"
dynamic = ["version"]
description = "StepFun (阶跃星辰) speech and chat plugin for LiveKit Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "StepFun" }]
keywords = ["webrtc", "realtime", "audio", "video", "livekit", "stepfun", "asr", "tts"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "livekit-agents[codecs]>=1.8.6",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
# The OpenAI-compatible chat client is optional for speech-only installs.
llm = [
    "livekit-plugins-openai>=1.8.6",
]
examples = [
    "livekit-agents[turn-detector]>=1.8.6",
    "python-dotenv>=1.0",
    "livekit-plugins-openai>=1.8.6",
    "livekit-plugins-silero>=1.8.6",
]
# Stronger denoising than the WebRTC suppression built into the SDK. Native
# build, so optional; STEPFUN_NOISE_CANCELLATION=webrtc needs nothing extra.
noise-cancellation = [
    "pyrnnoise>=0.4.3,<0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Documentation = "https://platform.stepfun.ai/docs"
Homepage = "https://www.stepfun.com/"
Source = "https://github.com/stepfun-ai/livekit-plugins-stepfun"

[tool.hatch.version]
path = "livekit/plugins/stepfun/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit", "/README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
# Match upstream plugin base-class annotations.
disallow_any_generics = false

# Allow type checking a speech-only install.
[[tool.mypy.overrides]]
module = ["livekit.plugins.openai", "livekit.plugins.openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
